name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bidtrace
          POSTGRES_PASSWORD: bidtrace-ci
          POSTGRES_DB: bidtrace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bidtrace -d bidtrace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and development tools
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Apply database migrations
        env:
          DATABASE_URL: postgresql+psycopg://bidtrace:bidtrace-ci@127.0.0.1:5432/bidtrace_test
        run: alembic upgrade head
      - name: Lint
        run: ruff check .
      - name: Verify migrations match models
        env:
          DATABASE_URL: postgresql+psycopg://bidtrace:bidtrace-ci@127.0.0.1:5432/bidtrace_test
        run: alembic check
      - name: Run PostgreSQL-backed tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://bidtrace:bidtrace-ci@127.0.0.1:5432/bidtrace_test
        run: pytest
