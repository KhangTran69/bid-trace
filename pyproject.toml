[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bidtrace"
version = "0.1.0"
description = "A local, auditable bid-document review demo"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "openpyxl>=3.1,<4",
  "psycopg[binary]>=3.2,<4",
  "pypdf>=5,<7",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["httpx2>=2.16.0,<3", "pytest>=8.3,<9", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*.css", "migrations/*.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
