<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}BidTrace{% endblock %}</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="BidTrace home">BidTrace</a>
    <a class="nav-link" href="/dashboard">Dashboard</a>
    <span class="tagline">Trace every reviewed number to its source.</span>
    {% if user %}
    <nav class="auth-nav" aria-label="Account">
      <span class="user-name">{{ user.display_name }}</span>
      <form action="/logout" method="post"><button class="link-button" type="submit">Sign out</button></form>
    </nav>
    {% endif %}
  </header>
  <main class="container">
    {% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">Local demo with synthetic bid data. Do not upload real bid documents.</footer>
</body>
</html>
